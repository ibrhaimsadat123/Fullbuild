<!doctype html>
<!-- AI-assisted (Claude): TwinWorlds app shell. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TwinWorlds</title>
    <meta name="description" content="Find the places on Earth that best match real sites on the Moon and Mars, using measurements taken the same way on both worlds." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='11' cy='16' r='8' fill='%23c1440e'/%3E%3Ccircle cx='21' cy='16' r='8' fill='%232f7fd1' fill-opacity='.85'/%3E%3C/svg%3E" />
  </head>
  <body class="mode-normal">
    <header class="topbar">
      <div class="brand">
        <span class="logo" aria-hidden="true"></span>
        <span class="name">TwinWorlds</span>
        <a class="api-link" href="/api.html" target="_blank" rel="noopener">API</a>
        <button id="story-btn" class="api-link" title="Play a 30-second guided tour (for the demo video)">▶ Story</button>
      </div>

      <div class="controls">
        <div class="seg" role="group" aria-label="World">
          <button data-world="mars" class="on">Mars</button>
          <button data-world="moon">Moon</button>
        </div>
        <label class="field">
          <span>Target</span>
          <select id="target-select"></select>
        </label>
        <label class="field">
          <span>Lens</span>
          <select id="lens-select"><option value="">Default</option></select>
        </label>
      </div>

      <form id="ask-form" class="ask" autocomplete="off">
        <input id="ask-input" type="text" placeholder="Ask the Planet: e.g. flat dusty ground for a lander" maxlength="300" />
        <button type="submit">Ask</button>
      </form>

      <button id="mode-toggle" class="mode" title="Switch Normal / Nerd mode" aria-pressed="false">
        <span class="normal-only">😎 Normal</span><span class="nerd-only">🤓 Nerd</span>
      </button>
    </header>

    <div id="story-cap" class="story-cap" hidden></div>
    <main class="stage">
      <section class="pane" id="pane-planet">
        <div id="planet-globe" class="globe"></div>
        <div class="pane-label"><span id="planet-label">Mars</span><span id="planet-site" class="site"></span></div>
        <div class="source-tag" id="planet-source"></div>
        <div class="reh-key"><button id="reh-btn" class="mini" aria-pressed="false">🗺 Rehearsability</button>
          <span class="reh-legend" hidden><i class="reh-bar"></i><span>analog desert</span><span>easy to rehearse on Earth</span></span></div>
      </section>
      <section class="pane" id="pane-earth">
        <div id="earth-globe" class="globe"></div>
        <div class="pane-label"><span>Earth</span><span id="earth-site" class="site"></span></div>
        <div class="badges" id="earth-badges"></div>
        <div class="legend" id="legend" hidden>
          <div class="legend-bar"></div>
          <div class="legend-ticks"><span>rest of Earth</span><span>top 10%</span><span>top 0.5%</span></div>
          <div class="zone-key"><button id="zones-btn" class="mini" aria-pressed="true">◎ Match zones</button><button id="undisc-btn" class="mini" aria-pressed="false" title="Hide well-studied analog sites">✦ Undiscovered</button>
            <span><i style="background:#ff5a36"></i>Exact 0.5%</span><span><i style="background:#ffb000"></i>Strong 2%</span><span><i style="background:#e8e35a"></i>Moderate 5%</span><span><i style="background:#5ac8c8"></i>Variable 10%</span></div>
        </div>
        <div class="source-tag" id="earth-source"></div>
      </section>

      <div class="dive-hud">
        <button id="dive-btn" class="primary">Dive</button>
        <select id="dive-pair" aria-label="Earth partner for Twin Dive"></select>
        <button id="reset-btn">Reset</button>
        <button id="mt-btn" hidden title="Rehearse Perseverance's real drive in Jezero on a matched path on Earth">🚙 Mission Twin</button>
        <button id="mt-play" hidden aria-label="Play or pause">▶</button>
        <label class="sun-ctl" title="Sun and shadows at the same local solar time on both worlds"><input type="checkbox" id="sun-on"> ☀ <input type="range" id="sun-hour" min="5" max="19" step="0.25" value="9" disabled> <span id="sun-label">off</span></label>
        <input id="mt-seek" type="range" min="0" max="1000" value="0" hidden aria-label="Mission progress" />
        <span id="dive-readout" class="readout"></span>
      </div>

      <aside class="drawer" id="drawer">
        <button class="drawer-toggle" id="drawer-toggle" aria-label="Show or hide the panel">⟨</button>
        <div class="drawer-body">
          <section class="card" id="card-target"></section>
          <section class="card" id="card-whatif"></section>
          <section class="card" id="card-mission" hidden></section>
          <section class="card" id="card-now" hidden></section>
          <section class="card" id="card-match"></section>
          <section class="card" id="card-travel" hidden></section>
          <section class="card" id="card-time" hidden></section>
          <section class="card nerd-only" id="card-nerd" hidden></section>
          <section class="card" id="card-ask" hidden></section>
          <section class="card" id="card-gaps"></section>
          <section class="card" id="card-minerals" hidden></section>
          <section class="card" id="card-ground" hidden></section>
          <section class="card" id="card-sky" hidden></section>
          <section class="card" id="card-landsat" hidden></section>
          <section class="card" id="card-blind"></section>
          <section class="card nerd-only" id="card-status"></section>
        </div>
      </aside>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
